<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263c36"><title>순간 기억 · 밤도리 인지훈련</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="memory.css?v=20260910-fit1"><link rel="stylesheet" href="ui.css?v=20260911-arithmetic3"><link rel="icon" href="favicon.svg"><script src="config.js"></script><script type="module" src="memory.mjs?v=20260911-arithmetic3"></script><link rel="stylesheet" href="header.css?v=20260910-header1"></head><body><header id="trainingHeader"><a class="brand" id="brand" href="./">밤도리 인지훈련</a><span class="edition">02 / 순간 기억</span></header><main>
<section class="screen" id="home"><div class="intro memory-intro"><h1>순간 기억</h1></div><div class="game-preview memory-preview" aria-label="순간 기억 풀이 화면 미리보기"><div class="play-top"><span>그만하기</span><span>0점</span></div><p class="phase">기억하세요</p><p class="hint" aria-hidden="true"></p><div class="board" aria-hidden="true"><span class="tile">3</span><span class="tile">1</span><span class="tile">4</span><span class="tile">2</span></div></div><button class="primary" id="start">훈련 시작 <span>→</span></button><p id="homeStatus" class="note" role="status"></p><div class="bottom-links"><button id="showRecords">나의 기록 ↗</button><button id="showRanking">랭킹 ↗</button></div><div class="hub-share"><p>주변 사람들의 뇌도 말랑말랑하게 만들어 주세요!</p><button type="button" data-hub-share><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg>공유하기</button><span role="status"></span><textarea hidden readonly aria-label="공유 문구와 허브 주소"></textarea></div><nav class="activity-nav home-hub" aria-label="허브 이동"><a href="./">메인 허브로 돌아가기</a></nav></section>
<section class="screen" id="play" hidden><div class="play-top"><button id="quit" class="text-button">그만하기</button><span id="roundLabel"></span></div><p class="phase" id="phase" role="status"></p><p class="hint" id="hint"></p><div class="board" id="board" aria-label="숫자 위치"></div></section>
<section class="screen" id="result" hidden><h1>훈련 완료!</h1><div class="result-time"><strong id="score"></strong><span>점</span></div><p id="saveStatus" class="note" role="status"></p><div id="publishBox" class="publish" hidden><label for="nickname">랭킹에 사용할 닉네임</label><input id="nickname" maxlength="12" placeholder="한글·영문·숫자·_ 2~12자" autocomplete="nickname"><label class="consent"><input id="consent" type="checkbox">닉네임과 기록을 전체 랭킹에 공개합니다.</label><button id="publish" class="secondary">랭킹 등록</button><p id="publishStatus" class="note" role="status"></p><button id="resultRanking" class="secondary" hidden>랭킹 보기 →</button></div><div class="hub-share"><p>주변 사람들의 뇌도 말랑말랑하게 만들어 주세요!</p><button type="button" data-hub-share><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg>공유하기</button><span role="status"></span><textarea hidden readonly aria-label="공유 문구와 허브 주소"></textarea></div><button id="again" class="primary">한 번 더</button><button id="homeButton" class="text-button full">처음으로</button></section>
<section class="screen" id="records" hidden><button id="recordBack" class="text-button">← 훈련으로</button><h1>나의 기록</h1><p class="note">브라우저에 최근 50회까지의 기록이 저장됩니다.</p><div id="recordList"></div><button id="clearRecords" class="text-button full">기기 기록 삭제</button></section><section class="screen" id="ranking" hidden><button id="rankBack" class="text-button">← 훈련으로</button><h1>랭킹</h1><label for="rankPeriod">집계 기간</label><select id="rankPeriod"><option value="all">전체 랭킹</option><option value="week">이번 주 랭킹</option></select><p class="note">주간 기준: 월요일 00:00 ~ 일요일 23:59 KST</p><div id="rankSearch" class="rank-search" role="search"><label for="rankNickname">닉네임 검색</label><div><input id="rankNickname" autocomplete="off" maxlength="12" placeholder="닉네임을 정확히 입력하세요"><button id="searchRanking" class="secondary" type="button">검색</button><button id="clearSearch" class="text-button" type="button">초기화</button></div></div><p id="rankNote" class="note">상위 50위까지만 조회할 수 있습니다</p><div id="rankList" role="status"></div></section></main><footer>밤도리 PSAT</footer><dialog id="quitDialog"><h2>이번 훈련을 그만할까요?</h2><p>진행 중인 기록은 저장되지 않습니다.</p><div><button id="keep" class="secondary">계속하기</button><button id="stop" class="primary">그만하기</button></div></dialog></body></html>
