<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263c36"><title>순간 기억 · 밤도리 인지훈련</title><style>
:root{--ink:#263c36;--lime:#d7f280;--paper:#f6f5ef;--muted:#6c7971;--line:#dfe4d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;letter-spacing:-.035em}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:3px solid #78953a;outline-offset:3px}[hidden]{display:none!important}header{max-width:940px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center}.brand{border:0;background:none;color:var(--ink);font-size:18px;font-weight:800;padding:0}.badge{font-size:11px;color:var(--muted)}main{max-width:440px;margin:24px auto;padding:0 22px}h1{font-size:36px;letter-spacing:-.06em;margin:12px 0}p{line-height:1.65}.note{color:var(--muted);font-size:14px}.example{background:#edf0e5;border-radius:20px;padding:22px;margin:24px 0}.example-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-width:220px;margin:auto}.example-grid span{background:white;border-radius:10px;text-align:center;padding:12px;font-size:26px;font-weight:750}.example-grid .blank{background:#dfe5d6}.example p{text-align:center;font-size:12px;margin:16px 0 0;color:var(--muted)}.courses{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 14px}.courses button{border:1px solid var(--line);border-radius:12px;padding:14px 4px;background:transparent;color:var(--ink);font-weight:750}.courses .chosen{background:#e9eedc;border:2px solid var(--ink);padding:13px 3px}.primary{border:0;border-radius:12px;min-height:52px;width:100%;padding:14px;background:var(--ink);color:var(--lime);font-weight:750}.text-button{border:0;background:none;color:var(--ink);padding:12px 0;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.phase{text-align:center;font-size:22px;font-weight:750;margin:24px 0 6px}.hint{text-align:center;color:var(--muted);font-size:13px;min-height:22px;margin:0 0 18px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{aspect-ratio:1;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font-size:36px;font-weight:800;min-width:0}.tile.covered{background:var(--ink);border-color:var(--ink);color:var(--lime)}.tile.covered:active{transform:scale(.96);background:#496346}.tile.empty{background:#eceee6;border-color:transparent}.tile.done{background:var(--lime);border-color:#b6cd72}.tile.missed{background:#ffe3dd;color:#a43e31;border:2px solid #a43e31}.tile.target{border:2px solid #76963e}.round-note{text-align:center;min-height:46px;margin:18px 0;font-size:14px;line-height:1.6}.result-number{text-align:center;font-size:76px;font-weight:800;margin:35px 0 0;letter-spacing:-.07em}.result-number small{font-size:24px;font-weight:500;letter-spacing:0}.result-caption{text-align:center;color:var(--muted);margin:0 0 30px}.wide{width:100%}footer{text-align:center;color:var(--muted);font-size:11px;padding:30px 12px calc(20px + env(safe-area-inset-bottom))}dialog{border:0;border-radius:18px;padding:24px;width:calc(100% - 40px);max-width:360px;color:var(--ink)}dialog::backdrop{background:#10221baa}dialog h2{font-size:20px}dialog>div{display:grid;grid-template-columns:1fr 1fr;gap:10px}dialog .secondary{border:0;border-radius:12px;background:#e9eedc;color:var(--ink);font-weight:700}@media(max-width:520px){main{margin-top:10px}header{padding:20px}h1{font-size:34px}}@media(max-height:720px){main{max-width:390px}.phase{margin-top:12px}.tile{font-size:30px}.round-note{margin:12px 0}footer{padding-top:18px}}

.phase{font-size:18px;font-weight:600;margin:18px 0 4px}
.hint{font-size:48px;font-weight:800;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;min-height:56px;margin:0 0 20px;letter-spacing:-.05em}
.hint.urgent{color:#ac3f35}
#roundLabel{font-size:18px;font-weight:750;color:var(--ink)}
.result-number{margin:35px 0}
body:has(#play:not([hidden])) footer{display:none}
@media(max-height:720px){.phase{margin-top:8px}.hint{font-size:44px;min-height:51px;margin-bottom:14px}}

input{font:inherit;box-sizing:border-box}input:not([type=checkbox]){width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;font-size:16px;margin:10px 0}.publish{background:#eaf0e0;border-radius:16px;padding:20px;margin:20px 0}.publish label,.rank-search label{font-size:13px}.consent{display:flex;align-items:center;gap:8px;margin:14px 0;line-height:1.6}.consent input{width:18px;height:18px;flex:none}.rank-search{margin-top:22px}.rank-search>div{display:flex;gap:10px;align-items:center}.rank-search button{flex:none}.row{display:flex;justify-content:space-between;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}.row small{display:block;color:var(--muted);font-size:11px;margin-top:6px}.row strong{font-size:16px}.row .points{flex:none}.note:empty{display:none}
select{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);margin-top:8px}</style><link rel="icon" href="favicon.svg"><script src="config.js"></script><script type="module" src="memory.mjs?v=20260910-week1"></script></head><body><header><button class="brand" id="brand">밤도리 인지훈련</button></header><main>
<section id="home"><h1>순간 기억</h1><p class="note">숫자를 기억하고, 가려지면 작은 수부터 누르세요.</p><div class="example"><div class="example-grid" aria-hidden="true"><span>3</span><span>1</span><span>4</span><span>2</span></div></div><button class="primary" id="start">훈련 시작 →</button><p id="homeStatus" class="note" role="status"></p><button id="showRanking" class="text-button wide">전체 랭킹 ↗</button></section>
<section id="play" hidden><div class="top"><button id="quit" class="text-button">그만하기</button><span id="roundLabel"></span></div><p class="phase" id="phase" role="status"></p><p class="hint" id="hint"></p><div class="board" id="board" aria-label="숫자 위치"></div></section>
<section id="result" hidden><h1>훈련 완료!</h1><div class="result-number"><span id="score"></span><small> 점</small></div><p id="saveStatus" class="note" role="status"></p><div id="publishBox" class="publish" hidden><label for="nickname">랭킹에 사용할 닉네임</label><input id="nickname" maxlength="12" placeholder="한글·영문·숫자·_ 2~12자" autocomplete="nickname"><label class="consent"><input id="consent" type="checkbox">닉네임과 기록을 전체 랭킹에 공개합니다.</label><button id="publish" class="primary">랭킹 등록</button><p id="publishStatus" class="note" role="status"></p><button id="resultRanking" class="text-button wide" hidden>랭킹 보기 →</button></div><button id="again" class="primary">한 번 더</button><button id="homeButton" class="text-button wide">처음으로</button></section>
<section id="ranking" hidden><button id="rankBack" class="text-button">← 훈련으로</button><h1>랭킹</h1><label for="rankPeriod">집계 기간</label><select id="rankPeriod"><option value="all">전체 랭킹</option><option value="week">이번 주 랭킹</option></select><p class="note">주간 기준: 월요일 00:00 ~ 일요일 23:59 KST</p><div class="rank-search" role="search"><label for="rankNickname">닉네임 검색</label><div><input id="rankNickname" maxlength="12" placeholder="닉네임을 정확히 입력하세요"><button id="searchRanking" class="text-button" type="button">검색</button><button id="clearSearch" class="text-button" type="button">초기화</button></div></div><p id="rankNote" class="note">상위 50위까지만 조회할 수 있습니다</p><div id="rankList" role="status"></div></section></main><footer>밤도리 PSAT</footer><dialog id="quitDialog"><h2>이번 훈련을 그만할까요?</h2><p>진행 중인 결과는 저장되지 않습니다.</p><div><button id="keep" class="secondary">계속하기</button><button id="stop" class="primary">그만하기</button></div></dialog></body></html>
